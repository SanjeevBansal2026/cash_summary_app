{% extends "admin/base_site.html" %}
{% load i18n static %}
{% block title %}CashFlow Admin Login{% endblock %}
{% block content %}
<div style="max-width:430px;margin:55px auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:30px;box-shadow:0 12px 35px #11131814">
  <h1 style="margin:0 0 6px;font-size:28px">Admin Sign In</h1><p style="color:#737984;margin-top:0">Superuser access only.</p>
  {% if form.errors %}<p class="errornote">Please enter a correct username and password.</p>{% endif %}
  <form method="post" action="{{ app_path }}">{% csrf_token %}{{ form.as_p }}
    <div style="margin-top:18px"><input type="submit" value="Sign in" class="default" style="width:100%;padding:12px;border-radius:10px;border:0;background:#e31b23;color:#fff;font-weight:800"></div>
  </form>
</div>
{% endblock %}
